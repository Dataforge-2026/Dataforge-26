<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cadastro de Professores</title>

    <link rel="stylesheet" href="cadastro-professores.css" />
  </head>

  <body>
    <div class="container">
      <h1>Cadastro de Professores</h1>

      <form id="form-professor">
        <label for="nome">Nome do professor</label>
        <input
          type="text"
          id="nome"
          name="nome"
          placeholder="Nome do professor"
          autocomplete="name"
          required
        />

        <label for="cpf">CPF</label>
        <input
          type="text"
          id="cpf"
          name="cpf"
          placeholder="CPF"
          autocomplete="off"
          required
        />

        <label for="disciplina">Disciplina</label>
        <input
          type="text"
          id="disciplina"
          name="disciplina"
          placeholder="Disciplina"
          required
        />

        <button type="submit">Cadastrar</button>
      </form>

      <hr />

      <h2>Professores Cadastrados</h2>

      <table class="tabela-professores">
        <thead>
          <tr>
            <th scope="col">Nome</th>
            <th scope="col">CPF</th>
            <th scope="col">Disciplina</th>
            <th scope="col">Ações</th>
          </tr>
        </thead>

        <tbody id="lista-professores"></tbody>
      </table>
    </div>

    <script src="cadastro-professores.js"></script>
  </body>
</html>
